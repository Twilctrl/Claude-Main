# hailcore settings. Read by hailo-ollama.service, hailcore-firstboot, hailcore-perf
# and the `hc` command. After editing: sudo systemctl restart hailo-ollama

# Model to pull on first boot and use by default in `hc chat`.
# List what the server offers with: hc models --available
HAILCORE_MODEL=qwen2.5-instruct:1.5b

# Ollama-compatible API that `hc` talks to.
HAILCORE_LLM_URL=http://127.0.0.1:8000

# CPU frequency governor: performance keeps tokenisation and the host side of
# inference snappy; ondemand or schedutil saves power and heat.
HAILCORE_GOVERNOR=performance

# Set to 1 to relay the API to the LAN on port 8001 so other machines can use
# the LLM. Off by default: the API has no authentication.
HAILCORE_LAN_API=0
