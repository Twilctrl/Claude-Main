# hailcore neon tmux theme
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 20000
set -g status-interval 5
set -g status-style "bg=black,fg=cyan"
set -g status-left "#[fg=black,bg=magenta,bold] HAILCORE #[fg=magenta,bg=black] "
set -g status-left-length 20
set -g status-right "#[fg=brightmagenta]#(vcgencmd measure_temp 2>/dev/null | cut -d= -f2) #[fg=cyan]│ #[fg=brightgreen]%H:%M #[fg=black,bg=cyan,bold] #h "
set -g status-right-length 60
setw -g window-status-format " #[fg=cyan]#I:#W "
setw -g window-status-current-format "#[fg=black,bg=brightcyan,bold] #I:#W "
set -g pane-border-style "fg=magenta"
set -g pane-active-border-style "fg=brightcyan"
set -g message-style "bg=magenta,fg=black"
