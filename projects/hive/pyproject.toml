[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-orchestrator"
version = "0.1.0"
description = "Run several local AI agents at once and let them collaborate on a shared project. Fully offline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hive = "hive.cli:main"

[tool.setuptools.packages.find]
include = ["hive*"]

[tool.setuptools.package-data]
hive = ["roles/*.yaml", "store/*.sql", "web/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
