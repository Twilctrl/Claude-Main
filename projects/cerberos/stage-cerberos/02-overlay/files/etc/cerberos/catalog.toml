# CerberOS catalog: every model and app in the start menu, sorted by strength.
#
# Models appear as /srv/local-models/<category>/<slug>/ and every tool can
# call them by that short name, e.g.  cerb chat chatbots/gemma
# Add your own in /etc/cerberos/catalog.d/*.toml (same format), then: cerb sync
#
# Model fields
#   head     npu    = Hailo-10H via hailo-ollama   (fast, leaves the CPU free)
#            cpu    = Ollama on the Pi's CPU       (any GGUF model, slower)
#            remote = the remote head in cerberos.conf (a bigger box on your LAN)
#   model    the name that head knows it by
#   preload  build     = baked into the image
#            firstboot = downloaded on first boot
#            ondemand  = downloaded the first time you pick it
#   ram_gb   memory it needs on the Pi (cpu head); the menu warns if you're short
#
# App kinds
#   builtin  part of cerb      pipx     Python CLI installed with pipx
#   docker   web app container script   install script in /usr/local/lib/cerberos/apps/<id>/

# --- categories (start menu order) -------------------------------------------

[[category]]
id = "chatbots"
name = "Chatbots"
tagline = "the voices in the dark"
icon = "internet-chat"

[[category]]
id = "coding"
name = "Coding"
tagline = "code forged in hellfire"
icon = "applications-development"

[[category]]
id = "reasoning"
name = "Reasoning"
tagline = "minds that think before they bite"
icon = "applications-science"

[[category]]
id = "vision"
name = "Vision"
tagline = "eyes of the hound"
icon = "camera-photo"

[[category]]
id = "voice"
name = "Voice"
tagline = "howls and whispers"
icon = "audio-input-microphone"

[[category]]
id = "agents"
name = "Agents & RAG"
tagline = "familiars that fetch and remember"
icon = "system-run"

[[category]]
id = "arsenal"
name = "Model Arsenal"
tagline = "devour, banish and bind models"
icon = "folder-download"

[[category]]
id = "underworld"
name = "Underworld"
