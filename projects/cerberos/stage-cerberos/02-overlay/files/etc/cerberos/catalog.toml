# --- models -------------------------------------------------------------------
# American-made models come first in every category and are preferred as
# defaults. On the NPU the choice is whatever Hailo has compiled: Meta's Llama
# is the only American one so far, so Qwen stays there as the fallback.

[[model]]
category = "chatbots"
slug = "llama-npu"
name = "Llama 3.2 1B (NPU)"
maker = "Meta"
origin = "US"
head = "npu"
model = "llama3.2:1b"
preload = "firstboot"
size_gb = 1.8
strengths = ["fast", "general chat", "runs on the NPU"]
blurb = "Meta's Llama on the Hailo-10H, so the CPU stays free. Needs Hailo GenAI Model Zoo 5.2 or newer."

