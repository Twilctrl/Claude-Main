# CerberOS settings. Shell-style KEY=value, read by the services and by `cerb`.
# Edit with `cerb config`, which restarts what needs restarting.

# Model used by `cerb chat`, `cerb ask` and the login screen. Use a catalog
# name (chatbots/gemma) or any model name a head knows (gemma3:1b).
CERBEROS_DEFAULT_MODEL=chatbots/llama-npu

# --- heads (model servers) ----------------------------------------------------
# NPU head: hailo-ollama on the Hailo-10H.
CERBEROS_NPU_URL=http://127.0.0.1:8000
# CPU head: Ollama on the Pi's CPU (moved off 11434 so the gate can have it).
CERBEROS_CPU_URL=http://127.0.0.1:11436
# Remote head: optional bigger machine on your LAN, for models too large for
# the Pi (coding/poolside). Ollama, LM Studio, llama.cpp server, vLLM...
#   CERBEROS_REMOTE_URL=http://192.168.1.50:11434
#   CERBEROS_REMOTE_API=ollama      # or: openai
#   CERBEROS_REMOTE_KEY=            # bearer token, if the server wants one
CERBEROS_REMOTE_URL=
CERBEROS_REMOTE_API=ollama
CERBEROS_REMOTE_KEY=

# --- the gate ------------------------------------------------------------------
# One Ollama- and OpenAI-compatible API in front of all the heads, on
# Ollama's usual port so apps find it without configuration.
CERBEROS_GATE_PORT=11434
# 1 = listen on the LAN too, so other machines can use your models. The API has
# no authentication unless you set CERBEROS_GATE_KEY.
CERBEROS_GATE_LAN=0
CERBEROS_GATE_KEY=

# --- tuning ----------------------------------------------------------------------
# CPU governor: performance (snappy) or ondemand / schedutil (cooler, quieter).
CERBEROS_GOVERNOR=performance
# Docker web apps (open-webui, anythingllm, n8n) to download on first boot.
CERBEROS_FIRSTBOOT_APPS="open-webui"
