# CerberOS: keep the LLM server's working set in RAM and the system responsive.
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Bigger socket buffers for streaming API responses to LAN clients.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.ipv4.tcp_fastopen = 3
