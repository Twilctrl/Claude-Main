# CerberOS hellfire tmux theme
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 20000
set -g status-interval 5
set -g status-style "bg=black,fg=red"
set -g status-left "#[fg=black,bg=red,bold] CERBEROS #[fg=red,bg=black] "
set -g status-left-length 20
set -g status-right "#[fg=yellow]#(vcgencmd measure_temp 2>/dev/null | cut -d= -f2) #[fg=red]│ #[fg=brightyellow]%H:%M #[fg=black,bg=brightred,bold] #h "
set -g status-right-length 60
setw -g window-status-format " #[fg=yellow]#I:#W "
setw -g window-status-current-format "#[fg=black,bg=brightyellow,bold] #I:#W "
set -g pane-border-style "fg=colour52"
set -g pane-active-border-style "fg=brightred"
set -g message-style "bg=red,fg=black"
